<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Maqueta 3D</title>
  <!-- Cargamos el visor de Google -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Fondo oscuro para contraste perfecto */
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #1a1a1a; 
      font-family: sans-serif;
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>

  <!-- Visor 3D con luces y sombras mejoradas -->
  <model-viewer 
    id="maqueta" 
    src="maqueta.glb" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1.5" 
    exposure="1.2">
  </model-viewer>

  <!-- Script para pintar el modelo automáticamente al cargar -->
  <script>
    const viewer = document.querySelector('#maqueta');

    viewer.addEventListener('load', () => {
      // Recorre todas las partes del modelo 3D
      for (const material of viewer.model.materials) {
        
        // 1. Aplica un color Beige/Crema Arquitectónico (Rojo, Verde, Azul, Opacidad)
        material.pbrMetallicRoughness.setBaseColorFactor([0.85, 0.80, 0.70, 1]);
        
        // 2. Le da un acabado mate (tipo yeso o cartón) para que las luces marquen bien los bordes
        material.pbrMetallicRoughness.setRoughnessFactor(0.9);
        material.pbrMetallicRoughness.setMetallicFactor(0.0);
      }
    });
  </script>

</body>
</html>
