<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto de Matemática</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #1a1a1a; 
      font-family: sans-serif;
      overflow: hidden;
    }
    
    /* Cartel del Título (Arriba Centro) */
    .cartel-titulo {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 15px 35px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .cartel-titulo h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
    }

    /* Cartel de Integrantes (Abajo Izquierda) */
    .cartel-integrantes {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      z-index: 10;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-width: 160px;
    }
    .cartel-integrantes h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 5px;
    }
    .cartel-integrantes ul {
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
      color: #dddddd;
      line-height: 1.6;
    }

    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>

  <!-- Título del Proyecto -->
  <div class="cartel-titulo">
    <h1>Proyecto de Matemática</h1>
  </div>

  <!-- Cuadro de Integrantes -->
  <div class="cartel-integrantes">
    <h2>Integrantes:</h2>
    <ul>
      <li>DARICKXS</li>
      <li>Nuriel</li>
      <li>Yusey</li>
      <li>Yoselin</li>
      <li>Chenoa</li>
      <li>Damaris</li>
    </ul>
  </div>

  <!-- Visor 3D -->
  <model-viewer 
    id="maqueta" 
    src="maqueta.glb" 
    camera-controls 
    auto-rotate 
    shadow-intensity="2" 
    shadow-softness="1"
    exposure="0.7" 
    environment-image="neutral">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#maqueta');

    viewer.addEventListener('load', () => {
      for (const material of viewer.model.materials) {
        material.pbrMetallicRoughness.setBaseColorFactor([0.75, 0.70, 0.60, 1]);
        material.pbrMetallicRoughness.setRoughnessFactor(1);
        material.pbrMetallicRoughness.setMetallicFactor(0);
      }
    });
  </script>

</body>
</html>
