<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto de Matemática</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #1a1a1a; 
      font-family: sans-serif;
      overflow: hidden; /* Evita barras de desplazamiento */
    }
    
    /* Estilos para el cartel del título */
    .cartel-titulo {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 15px 35px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(4px); /* Efecto cristal transparente */
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .cartel-titulo h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
    }
    .cartel-titulo p {
      margin: 5px 0 0 0;
      font-size: 15px;
      color: #cccccc;
    }

    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>

  <!-- Título del Proyecto -->
  <div class="cartel-titulo">
    <h1>Proyecto de Matemática</h1>
  </div>

  <!-- Visor 3D con luces corregidas para resaltar alturas -->
  <model-viewer 
    id="maqueta" 
    src="maqueta.glb" 
    camera-controls 
    auto-rotate 
    shadow-intensity="2" 
    shadow-softness="1"
    exposure="0.7" 
    environment-image="neutral">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#maqueta');

    viewer.addEventListener('load', () => {
      for (const material of viewer.model.materials) {
        // Tono beige ligeramente más oscuro y mate para que la luz dibuje sombras
        material.pbrMetallicRoughness.setBaseColorFactor([0.75, 0.70, 0.60, 1]);
        material.pbrMetallicRoughness.setRoughnessFactor(1);
        material.pbrMetallicRoughness.setMetallicFactor(0);
      }
    });
  </script>

</body>
</html>
