<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto de Matemática</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #1a1a1a; 
      font-family: sans-serif;
      overflow: hidden;
    }
    
    /* Cartel del Título */
    .cartel-titulo {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6); color: white; padding: 15px 35px;
      border-radius: 12px; text-align: center; z-index: 10;
      backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .cartel-titulo h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }

    /* Cartel de Integrantes */
    .cartel-integrantes {
      position: absolute; bottom: 30px; left: 30px;
      background: rgba(0, 0, 0, 0.6); color: white; padding: 15px 25px;
      border-radius: 12px; z-index: 10; backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2); min-width: 160px;
    }
    .cartel-integrantes h2 {
      margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 5px;
    }
    .cartel-integrantes ul { margin: 0; padding-left: 18px; font-size: 14px; color: #dddddd; line-height: 1.6; }

    /* Diseño de las etiquetas 3D */
    .etiqueta-3d {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 15px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .etiqueta-3d::after { 
      content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
      border: 8px solid transparent; border-top-color: rgba(255, 255, 255, 0.9);
    }

    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div class="cartel-titulo"><h1>Proyecto de Matemática</h1></div>
  <div class="cartel-integrantes">
    <h2>Integrantes:</h2>
    <ul>
      <li>DARICKXS</li><li>Nuriel</li><li>Yusey</li><li>Yoselin</li><li>Chenoa</li><li>Damaris</li>
    </ul>
  </div>

  <model-viewer id="maqueta" src="maqueta.glb" camera-controls auto-rotate shadow-intensity="2" shadow-softness="1" exposure="0.7" environment-image="neutral">
    
    <!-- TUS 5 ETIQUETAS ESTÁN AQUÍ -->
    <button class="etiqueta-3d" slot="hotspot-1" data-position="19.74410057067871 4.846657719923996 -36.73181993641691" data-normal="0 1 0">Hospital</button>
    <button class="etiqueta-3d" slot="hotspot-2" data-position="-43.72760009765631 6.137501788925633 2.1175539872553735" data-normal="0 1 0">Colegio</button>
    <button class="etiqueta-3d" slot="hotspot-3" data-position="24.585311025772143 13.591987469016232 -6.44793800330774" data-normal="0 1 0">Mercado de abastos</button>
    <button class="etiqueta-3d" slot="hotspot-4" data-position="12.256764036670376 0.6000000238418579 -58.90683741199626" data-normal="0 1 0">Parque</button>
    <button class="etiqueta-3d" slot="hotspot-5" data-position="-64.30729675292969 16.066427002911155 44.739311165736495" data-normal="0 1 0">Biblioteca</button>

  </model-viewer>

  <script>
    const viewer = document.querySelector('#maqueta');


    // Herramienta para obtener coordenadas con doble clic
    viewer.addEventListener('dblclick', (event) => {
      const hit = viewer.positionAndNormalFromPoint(event.clientX, event.clientY);
      if (hit) {
        const posicion = `${hit.position.x} ${hit.position.y} ${hit.position.z}`;
        prompt("Copia esta coordenada (data-position) y pégala en GitHub:", posicion);
      }
    });
  </script>

</body>
</html>
